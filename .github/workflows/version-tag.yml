name: Version tag

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-version-tag:
    name: Validate version tag
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether PR should create a build
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          needs_build=false
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          git diff --name-only "${BASE_SHA}" HEAD > changed-files.txt

          echo "Changed files:"
          cat changed-files.txt

          while IFS= read -r path; do
            case "${path}" in
              CodexMeter/*|CodexMeterTests/*|CodexMeterUITests/*|CodexMeter.xcodeproj/*|AppIcon.icon/*)
                needs_build=true
                break
                ;;
            esac
          done < changed-files.txt

          echo "needs_build=${needs_build}" >> "${GITHUB_OUTPUT}"
          echo "Needs build: ${needs_build}"

      - name: Read app version
        id: version
        if: steps.changes.outputs.needs_build == 'true'
        run: |
          set -euo pipefail

          version="$(xcodebuild -showBuildSettings \
            -project CodexMeter.xcodeproj \
            -scheme CodexMeter \
            -configuration Release \
            | awk -F'= ' '/MARKETING_VERSION/ {print $2; exit}')"

          if [[ -z "${version}" ]]; then
            echo "Unable to read MARKETING_VERSION from the CodexMeter target." >&2
            exit 1
          fi

          tag="v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "CodexMeter version: ${version}"
          echo "Expected tag: ${tag}"

      - name: Skip version check for non-build PR
        if: steps.changes.outputs.needs_build != 'true'
        run: echo "This PR does not change build inputs, so it can merge without creating a release build."

      - name: Fail if build version tag already exists
        if: steps.changes.outputs.needs_build == 'true'
        run: |
          set -euo pipefail

          git fetch --tags --force

          if git rev-parse --verify --quiet "refs/tags/${{ steps.version.outputs.tag }}"; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists, and this PR changes build inputs. Bump MARKETING_VERSION before merging to main." >&2
            exit 1
          fi

  create-version-tag:
    name: Create version tag
    if: github.event_name == 'push'
    runs-on: macos-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine whether push should create a build
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          needs_build=false
          git diff --name-only "${BEFORE_SHA}" HEAD > changed-files.txt

          echo "Changed files:"
          cat changed-files.txt

          while IFS= read -r path; do
            case "${path}" in
              CodexMeter/*|CodexMeterTests/*|CodexMeterUITests/*|CodexMeter.xcodeproj/*|AppIcon.icon/*)
                needs_build=true
                break
                ;;
            esac
          done < changed-files.txt

          echo "needs_build=${needs_build}" >> "${GITHUB_OUTPUT}"
          echo "Needs build: ${needs_build}"

      - name: Skip release for non-build push
        if: steps.changes.outputs.needs_build != 'true'
        run: echo "This push does not change build inputs, so no release build will be created."

      - name: Read app version
        id: version
        if: steps.changes.outputs.needs_build == 'true'
        run: |
          set -euo pipefail

          version="$(xcodebuild -showBuildSettings \
            -project CodexMeter.xcodeproj \
            -scheme CodexMeter \
            -configuration Release \
            | awk -F'= ' '/MARKETING_VERSION/ {print $2; exit}')"

          if [[ -z "${version}" ]]; then
            echo "Unable to read MARKETING_VERSION from the CodexMeter target." >&2
            exit 1
          fi

          tag="v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "CodexMeter version: ${version}"
          echo "Expected tag: ${tag}"

      - name: Create and push tag
        if: steps.changes.outputs.needs_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            echo "Tag ${tag} already exists. Skipping release build."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "CodexMeter ${{ steps.version.outputs.version }}"
          git push origin "${tag}"
          gh workflow run release.yml --ref "${tag}"
