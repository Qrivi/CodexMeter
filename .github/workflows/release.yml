name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read tag version
        id: version
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          if [[ -z "${version}" || "${version}" == "${tag}" ]]; then
            echo "Release tags must use the v<version> format." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Compute build number
        id: build
        run: |
          set -euo pipefail

          build_number="$(git rev-list --count HEAD)"
          if [[ -z "${build_number}" || "${build_number}" == "0" ]]; then
            echo "Unable to compute build number." >&2
            exit 1
          fi

          echo "number=${build_number}" >> "${GITHUB_OUTPUT}"
          echo "Build number: ${build_number}"

      - name: Build app
        run: |
          set -euo pipefail

          xcodebuild \
            -project CodexMeter.xcodeproj \
            -scheme CodexMeter \
            -configuration Release \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            CURRENT_PROJECT_VERSION="${{ steps.build.outputs.number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify app bundle
        run: |
          set -euo pipefail

          app_path="${RUNNER_TEMP}/DerivedData/Build/Products/Release/CodexMeter.app"
          icon_path="${app_path}/Contents/Resources/AppIcon.icns"
          info_plist="${app_path}/Contents/Info.plist"

          if [[ ! -d "${app_path}" ]]; then
            echo "Built app was not found at ${app_path}." >&2
            exit 1
          fi

          if [[ ! -f "${icon_path}" ]]; then
            echo "Built app is missing ${icon_path}." >&2
            exit 1
          fi

          plist_build_number="$(plutil -extract CFBundleVersion raw -o - "${info_plist}")"
          if [[ "${plist_build_number}" != "${{ steps.build.outputs.number }}" ]]; then
            echo "Expected CFBundleVersion ${{ steps.build.outputs.number }}, got ${plist_build_number}." >&2
            exit 1
          fi

      - name: Create DMG
        id: dmg
        run: |
          set -euo pipefail

          tag="${{ steps.version.outputs.tag }}"
          app_path="${RUNNER_TEMP}/DerivedData/Build/Products/Release/CodexMeter.app"
          staging_dir="${RUNNER_TEMP}/CodexMeter-dmg"
          dmg_path="${RUNNER_TEMP}/CodexMeter-${tag}.dmg"

          if [[ ! -d "${app_path}" ]]; then
            echo "Built app was not found at ${app_path}." >&2
            exit 1
          fi

          mkdir -p "${staging_dir}"
          cp -R "${app_path}" "${staging_dir}/"
          ln -s /Applications "${staging_dir}/Applications"

          hdiutil create \
            -volname "CodexMeter ${{ steps.version.outputs.version }}" \
            -srcfolder "${staging_dir}" \
            -ov \
            -format UDZO \
            "${dmg_path}"

          echo "path=${dmg_path}" >> "${GITHUB_OUTPUT}"
          echo "name=CodexMeter-${tag}.dmg" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.dmg.outputs.path }}#${{ steps.dmg.outputs.name }}" \
            --title "CodexMeter ${{ steps.version.outputs.tag }}" \
            --notes "CodexMeter ${{ steps.version.outputs.tag }}" \
            --verify-tag
