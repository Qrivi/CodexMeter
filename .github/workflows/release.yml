name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
            display_name: Apple Silicon
          - arch: x86_64
            runner: macos-26-intel
            display_name: Intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read tag version
        id: version
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          if [[ -z "${version}" || "${version}" == "${tag}" ]]; then
            echo "Release tags must use the v<version> format." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Compute build number
        id: build
        run: |
          set -euo pipefail

          build_number="$(git rev-list --count HEAD)"
          if [[ -z "${build_number}" || "${build_number}" == "0" ]]; then
            echo "Unable to compute build number." >&2
            exit 1
          fi

          echo "number=${build_number}" >> "${GITHUB_OUTPUT}"
          echo "Build number: ${build_number}"

      - name: Prepare signing and notarization
        env:
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077

          for name in MACOS_SIGNING_CERTIFICATE MACOS_SIGNING_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Required secret ${name} is not configured." >&2
              exit 1
            fi
          done

          certificate_path="${RUNNER_TEMP}/signing-certificate.p12"
          keychain_path="${RUNNER_TEMP}/signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::${keychain_password}"

          printf '%s' "${MACOS_SIGNING_CERTIFICATE}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -P "${MACOS_SIGNING_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain_path}" > /dev/null
          security list-keychains -d user -s "${keychain_path}" "${HOME}/Library/Keychains/login.keychain-db"
          rm -f "${certificate_path}"

          identity="$(security find-identity -v -p codesigning "${keychain_path}" \
            | awk -v team="(${APPLE_TEAM_ID})" '/"Developer ID Application:/ && index($0, team) {print $2; exit}')"
          if [[ -z "${identity}" ]]; then
            echo "No valid Developer ID Application identity matches APPLE_TEAM_ID." >&2
            exit 1
          fi
          echo "SIGNING_IDENTITY=${identity}" >> "${GITHUB_ENV}"

          xcrun notarytool store-credentials CodexMeter \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --keychain "${keychain_path}"

          /usr/libexec/PlistBuddy -c 'Add :method string developer-id' "${RUNNER_TEMP}/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "${RUNNER_TEMP}/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :signingCertificate string ${identity}" "${RUNNER_TEMP}/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string ${APPLE_TEAM_ID}" "${RUNNER_TEMP}/ExportOptions.plist"

      - name: Archive and export ${{ matrix.display_name }} app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          xcodebuild \
            -project CodexMeter.xcodeproj \
            -scheme CodexMeter \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData-${{ matrix.arch }}" \
            -archivePath "${RUNNER_TEMP}/CodexMeter.xcarchive" \
            -hideShellScriptEnvironment \
            ARCHS="${{ matrix.arch }}" \
            ONLY_ACTIVE_ARCH=NO \
            CURRENT_PROJECT_VERSION="${{ steps.build.outputs.number }}" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${SIGNING_IDENTITY}" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            archive

          xcodebuild -exportArchive \
            -archivePath "${RUNNER_TEMP}/CodexMeter.xcarchive" \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" \
            -exportPath "${RUNNER_TEMP}/export"

      - name: Verify ${{ matrix.display_name }} app bundle
        run: |
          set -euo pipefail

          app_path="${RUNNER_TEMP}/export/CodexMeter.app"
          executable_path="${app_path}/Contents/MacOS/CodexMeter"
          icon_path="${app_path}/Contents/Resources/AppIcon.icns"
          info_plist="${app_path}/Contents/Info.plist"

          codesign --verify --deep --strict --verbose=2 "${app_path}"
          codesign --verify --strict \
            -R='anchor apple generic and certificate leaf[field.1.2.840.113635.100.6.1.13] exists' \
            "${app_path}"

          if [[ ! -d "${app_path}" ]]; then
            echo "Built app was not found at ${app_path}." >&2
            exit 1
          fi

          if [[ ! -f "${icon_path}" ]]; then
            echo "Built app is missing ${icon_path}." >&2
            exit 1
          fi

          if [[ ! -f "${executable_path}" ]]; then
            echo "Built app is missing ${executable_path}." >&2
            exit 1
          fi

          if ! lipo -archs "${executable_path}" | tr ' ' '\n' | grep -Fxq "${{ matrix.arch }}"; then
            echo "Built executable does not contain the ${{ matrix.arch }} architecture." >&2
            lipo -archs "${executable_path}" >&2
            exit 1
          fi

          plist_build_number="$(plutil -extract CFBundleVersion raw -o - "${info_plist}")"
          if [[ "${plist_build_number}" != "${{ steps.build.outputs.number }}" ]]; then
            echo "Expected CFBundleVersion ${{ steps.build.outputs.number }}, got ${plist_build_number}." >&2
            exit 1
          fi

          sdk_name="$(plutil -extract DTSDKName raw -o - "${info_plist}")"
          if [[ "${sdk_name}" != macosx26* ]]; then
            echo "Expected a macOS 26 SDK build, got ${sdk_name}." >&2
            exit 1
          fi

      - name: Notarize and staple ${{ matrix.display_name }} app
        run: |
          set -euo pipefail

          app_path="${RUNNER_TEMP}/export/CodexMeter.app"
          zip_path="${RUNNER_TEMP}/CodexMeter-notarization.zip"
          ditto -c -k --sequesterRsrc --keepParent "${app_path}" "${zip_path}"
          bash .github/scripts/notarize.sh "${zip_path}" app
          xcrun stapler staple "${app_path}"
          xcrun stapler validate "${app_path}"
          spctl --assess --type execute --verbose=2 "${app_path}"

      - name: Create ${{ matrix.display_name }} DMG
        id: dmg
        run: |
          set -euo pipefail

          tag="${{ steps.version.outputs.tag }}"
          app_path="${RUNNER_TEMP}/export/CodexMeter.app"
          staging_dir="${RUNNER_TEMP}/CodexMeter-${{ matrix.arch }}-dmg"
          dmg_path="${RUNNER_TEMP}/CodexMeter-${tag}-${{ matrix.arch }}.dmg"

          if [[ ! -d "${app_path}" ]]; then
            echo "Built app was not found at ${app_path}." >&2
            exit 1
          fi

          rm -rf "${staging_dir}"
          mkdir -p "${staging_dir}"
          ditto "${app_path}" "${staging_dir}/CodexMeter.app"
          ln -s /Applications "${staging_dir}/Applications"

          hdiutil create \
            -volname "CodexMeter ${{ steps.version.outputs.version }}" \
            -srcfolder "${staging_dir}" \
            -ov \
            -format UDZO \
            "${dmg_path}"

          echo "path=${dmg_path}" >> "${GITHUB_OUTPUT}"
          echo "name=CodexMeter-${tag}-${{ matrix.arch }}.dmg" >> "${GITHUB_OUTPUT}"

      - name: Sign, notarize, and staple ${{ matrix.display_name }} DMG
        env:
          DMG_PATH: ${{ steps.dmg.outputs.path }}
        run: |
          set -euo pipefail

          codesign --force --timestamp --sign "${SIGNING_IDENTITY}" "${DMG_PATH}"
          codesign --verify --strict --verbose=2 "${DMG_PATH}"
          bash .github/scripts/notarize.sh "${DMG_PATH}" dmg
          xcrun stapler staple "${DMG_PATH}"
          xcrun stapler validate "${DMG_PATH}"
          spctl --assess --type open --context context:primary-signature --verbose=2 "${DMG_PATH}"

      - name: Upload verified DMG
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      - name: Upload notarization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notarization-${{ matrix.arch }}
          path: ${{ runner.temp }}/notarization-*.json
          if-no-files-found: ignore

      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" || true
          rm -f "${RUNNER_TEMP}/signing-certificate.p12"

  publish:
    name: Publish verified release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download both DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          assets=("release/CodexMeter-${TAG}-arm64.dmg" "release/CodexMeter-${TAG}-x86_64.dmg")
          for asset in "${assets[@]}"; do
            test -f "${asset}"
          done

          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" "${assets[@]}" --clobber
          else
            gh release create "${TAG}" "${assets[@]}" \
              --title "CodexMeter ${TAG}" \
              --notes "CodexMeter ${TAG}" \
              --verify-tag
          fi

  notify-tap:
    name: Notify Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    environment: homebrew-tap

    steps:
      - name: Dispatch tap update
        env:
          TAP_DISPATCH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ -z "${TAP_DISPATCH_TOKEN}" ]]; then
            echo "TAP_DISPATCH_TOKEN is not configured." >&2
            exit 1
          fi

          curl -fsSL -X POST https://api.github.com/repos/Qrivi/homebrew-tap/dispatches \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TAP_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"event_type\":\"bump-tap\",\"client_payload\":{\"package\":\"codexmeter\",\"repo\":\"Qrivi/CodexMeter\",\"tag\":\"${TAG}\"}}"
